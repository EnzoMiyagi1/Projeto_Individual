<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoSports | Dashboard</title>

    <link rel="stylesheet" href="../css/dashboards.css">
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/sessao.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="janela">
        <div class="header-left">
            <h1>AutoSports</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

          
              <div class="quiz" >
                 <button class="btn-sideBar" onclick="Quiz()">Quiz</button>
            </div>

            
              <div class="DashBoard-esquerdo" >
                 <button class="btn-sideBar" >Dashboard</button>
            </div>

        
            <div class="Historia" >
                 <button class="btn-sideBar" onclick="historia()">Historia</button> 
            </div>

            <div class="logout" >
                <button class="btn-sideBar" onclick="limparSessao()">Log Out</button>
            </div>

            
        </div>

        <div class="dash">

            <div class="dash-topo">
                <div class="faixa"></div>
                <h2>Seu desempenho no quiz</h2>
                <p>Resumo de todas as suas tentativas.</p>
            </div>


            <div class="kpi-grid">
                <div class="kpi-card acertos">
                    <div class="kpi-rotulo">Acertos</div>
                    <div class="kpi-valor" id="kpi_acertos">0</div>
                    <div class="kpi-detalhe" id="kpi_acertos_pct"></div>
                </div>

                <div class="kpi-card erros">
                    <div class="kpi-rotulo">Erros</div>
                    <div class="kpi-valor" id="kpi_erros">0</div>
                    <div class="kpi-detalhe" id="kpi_erros_pct"></div>
                </div>

                <div class="kpi-card tentativas">
                    <div class="kpi-rotulo">Tentativas</div>
                    <div class="kpi-valor" id="kpi_tentativas">0</div>
                    <div class="kpi-detalhe" id="kpi_tentativas_melhor"></div>
                </div>
            </div>


            <div class="painel-linha">


                <div class="painel-grafico" id="painelGrafico">

                    <h3>Acertos & Erros Totais</h3>

                    <div class="area-pizza">
                        <canvas id="graficoPizza"></canvas>

                    </div>
                    <p class="legenda-texto" id="resumoTexto"></p>
                </div>


                <div class="painel-grafico" id="painelGraficoUltima">
                    <h3>Ultima tentativa</h3>
                    <div class="area-pizza">
                        <canvas id="graficoPizzaUltima"></canvas>
                    </div>
                    <p class="legenda-texto" id="resumoTextUltima"></p>
                </div>

            </div>



            <div class="painel-grafico" id="avisoVazio" style="display: none">
                <p class="legenda-texto" style="margin-top: 0">
                    Você ainda não fez nenhum quiz.
                    <a href="../exemplo_de_quiz/EXEMPLO_QUIZZ.html" style="color: #e10600; font-weight: 700">Faça o
                        primeiro!</a>
                </p>
            </div>

        </div>
    </div>

    <script>
        function Quiz(){
            window.location = '../exemplo_de_quiz/EXEMPLO_QUIZZ.html'
        }

        function historia(){
            window.location = './historia.html'
        }
        

        validarSessao();

        Chart.defaults.color = '#e6e6ea';
        Chart.defaults.font.size = 14;

        let graficoPizza;
        let graficoPizzaUltima;

        if (sessionStorage.ID_USUARIO) {
            obterDadosGrafico();
        }



        function obterDadosGrafico() {
            var idUsuario = sessionStorage.ID_USUARIO;



            fetch(`/tentativa/resumo/${idUsuario}`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                        mostrarKpis(resposta[0]);
                        plotarGrafico(resposta[0]);
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });

            fetch(`/tentativa/ultima/${idUsuario}`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (resposta) {
                        console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);

                        if (resposta.length > 0) {
                            plotarGraficoUltimo(resposta[0]);
                        } else {
                        
                                document.getElementById('painelGraficoUltima').style.display = 'none';
                                document.getElementById('avisoVazio').style.display = 'block';
                                return;
                            
                        }

                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            })
                .catch(function (error) {
                    console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
                });
        }

        function mostrarKpis(resumo) {

            var acertos = Number(resumo.acertos);
            var erros = Number(resumo.erros);
            var tentativas = Number(resumo.tentativas);
            var total = acertos + erros;

            var pctAcertos = total > 0 ? Math.round(100 * acertos / total) : 0;
            var pctErros = total > 0 ? 100 - pctAcertos : 0;

            animarNumero('kpi_acertos', acertos);
            animarNumero('kpi_erros', erros);
            animarNumero('kpi_tentativas', tentativas);

            document.getElementById('kpi_acertos_pct').innerHTML = pctAcertos + '% das respostas';
            document.getElementById('kpi_erros_pct').innerHTML = pctErros + '% das respostas';
            document.getElementById('kpi_tentativas_melhor').innerHTML =
                tentativas > 0 ? 'Melhor resultado: ' + resumo.melhor + ' acertos' : 'Nenhuma tentativa ainda';
        }


        function animarNumero(idElemento, valorFinal) {
            var elemento = document.getElementById(idElemento);
            var passos = 20;
            var atual = 0;

            var intervalo = setInterval(function () {
                atual++;
                elemento.innerHTML = Math.round(valorFinal * atual / passos);
                if (atual >= passos) { clearInterval(intervalo); }
            }, 20);
        }

        function plotarGrafico(resumo) {
            var acertos = Number(resumo.acertos);
            var erros = Number(resumo.erros);
            var total = acertos + erros;


            if (total == 0) {
                document.getElementById('painelGrafico').style.display = 'none';
                document.getElementById('avisoVazio').style.display = 'block';
                return;
            }




            graficoPizza = new Chart(document.getElementById('graficoPizza'), {
                type: 'doughnut',
                data: {
                    labels: ['Acertos', 'Erros'],
                    datasets: [{
                        data: [acertos, erros],
                        backgroundColor: ['#2ecc71', '#e10600'],
                        borderColor: '#15151e',
                        borderWidth: 4,
                        hoverOffset: 14
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 18, usePointStyle: true } }
                    }
                }
            });


            var pctAcertos = Math.round(100 * acertos / total);
            document.getElementById('resumoTexto').innerHTML =
                'Aproveitamento geral: <strong style="color: #fff">' + pctAcertos + '%</strong> (' + acertos + ' de ' + total + ' perguntas)';
        }

        function plotarGraficoUltimo(ultima) {
            var acertos = Number(ultima.acertos);
            var erros = Number(ultima.erros);
            var total = acertos + erros;

            graficoPizzaUltima = new Chart(document.getElementById('graficoPizzaUltima'), {
                type: 'doughnut',
                data: {
                    labels: ['Acertos', 'Erros'],
                    datasets: [{
                        data: [acertos, erros],
                        backgroundColor: ['#2ecc71', '#e10600'],
                        borderColor: '#15151e',
                        borderWidth: 4,
                        hoverOffset: 14
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { padding: 18, usePointStyle: true } }
                    }
                }
            });





            var pctAcertos = Math.round(100 * acertos / total);
            document.getElementById('resumoTextUltima').innerHTML =
                'Aproveitamento geral: <strong style="color: #fff">' + pctAcertos + '%</strong> (' + acertos + ' de ' + total + ' perguntas)';
        }

    </script>

</body>

</html>
